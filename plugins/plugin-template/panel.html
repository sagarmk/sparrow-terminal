<!DOCTYPE html>
<html>
<head>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, system-ui, sans-serif;
    font-size: 13px;
    line-height: 1.5;
    padding: 16px;
    overflow-y: auto;
  }
  .header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 16px;
  }
  .header h1 { font-size: 15px; font-weight: 600; }
  .close-btn {
    background: none;
    border: 1px solid;
    width: 24px;
    height: 24px;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 14px;
    line-height: 1;
  }
  .close-btn:hover { opacity: 0.8; }
  .field {
    margin-bottom: 12px;
  }
  .label {
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 0.5px;
    margin-bottom: 4px;
  }
  .value {
    font-family: 'JetBrains Mono', 'SF Mono', Menlo, monospace;
    font-size: 12px;
  }
</style>
</head>
<body>
  <div class="header">
    <h1>My Plugin</h1>
    <button class="close-btn" id="close-btn" title="Close">&times;</button>
  </div>

  <div class="field">
    <div class="label">Working Directory</div>
    <div class="value" id="cwd">...</div>
  </div>

  <div class="field">
    <div class="label">Git Branch</div>
    <div class="value" id="branch">...</div>
  </div>

  <script>
    // Apply theme colors
    var t = SparrowBridge.theme;
    document.body.style.background = t.background;
    document.body.style.color = t.text;
    document.querySelector('.label').style.color = t.textMuted;
    document.querySelectorAll('.label').forEach(function(el) { el.style.color = t.textMuted; });
    document.querySelector('.close-btn').style.borderColor = t.border;
    document.querySelector('.close-btn').style.color = t.textMuted;

    // Track working directory
    SparrowBridge.getCwd().then(function(cwd) {
      document.getElementById('cwd').textContent = cwd || '(unknown)';
      loadGit(cwd);
    });
    SparrowBridge.onCwdChange(function(cwd) {
      document.getElementById('cwd').textContent = cwd || '(unknown)';
      loadGit(cwd);
    });

    // Git status
    function loadGit(cwd) {
      if (!cwd) return;
      SparrowBridge.git.getStatus(cwd).then(function(status) {
        if (status && status.isRepo) {
          document.getElementById('branch').textContent = status.branch + (status.isDirty ? ' *' : '');
        } else {
          document.getElementById('branch').textContent = '(not a repo)';
        }
      });
    }

    document.getElementById('close-btn').addEventListener('click', function() {
      SparrowBridge.close();
    });
  </script>
</body>
</html>
